name: Remote Helper Artifacts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Helper platform (single-platform runs build only; never publish)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - macos
      source_ref:
        description: Optional release tag or full commit SHA (build only; never publishes)
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helper-artifacts.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/build.rs"
      - "src-tauri/src/**"

permissions:
  contents: write

concurrency:
  group: helper-artifacts-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'push' }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve Helper Source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Resolve and validate source commit
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$(git rev-parse --verify "$SOURCE_REF^{commit}")" = "$SOURCE_SHA"
          elif [[ "$SOURCE_REF" =~ ^(refs/tags/)?remote-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]; then
            TAG="${SOURCE_REF#refs/tags/}"
            test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
            test "$TAG" = "$(node -p "require('./release-identity.json').current.releaseTag")"
          else
            echo 'source_ref must be a release tag or full commit SHA, not a moving branch' >&2
            exit 1
          fi
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Building checked-out source $SOURCE_SHA (workflow event $GITHUB_SHA)"
      - name: Validate checked-out helper identity
        run: node scripts/release-identity.mjs

  build-helper:
    name: Build Helper (${{ matrix.os }})
    needs: source
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'linux-x64' && '[{"os":"ubuntu-22.04","helper_os":"Linux","helper_arch":"x86_64","helper_path":"src-tauri/target/release/cc-switch-remote-helper"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'linux-arm64' && '[{"os":"ubuntu-22.04-arm","helper_os":"Linux","helper_arch":"arm64","helper_path":"src-tauri/target/release/cc-switch-remote-helper"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && '[{"os":"macos-15","helper_os":"macOS","helper_arch":"universal","helper_path":"src-tauri/target/universal-apple-darwin/release/cc-switch-remote-helper"}]' || '[{"os":"ubuntu-22.04","helper_os":"Linux","helper_arch":"x86_64","helper_path":"src-tauri/target/release/cc-switch-remote-helper"},{"os":"ubuntu-22.04-arm","helper_os":"Linux","helper_arch":"arm64","helper_path":"src-tauri/target/release/cc-switch-remote-helper"},{"os":"macos-15","helper_os":"macOS","helper_arch":"universal","helper_path":"src-tauri/target/universal-apple-darwin/release/cc-switch-remote-helper"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.source-sha }}

      - name: Verify pinned source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$SOURCE_SHA"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev

      - name: Cache Cargo registry and build
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: helper-cc-switch-remote-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: helper-cc-switch-remote-${{ runner.os }}-${{ runner.arch }}-

      - name: Build remote helper CLI
        shell: bash
        run: |
          set -euxo pipefail
          # Set only this process environment; never try to override via GITHUB_ENV.
          export GITHUB_SHA="$SOURCE_SHA"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features --features proxy-runtime --target aarch64-apple-darwin --bin cc-switch-remote-helper
            cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features --features proxy-runtime --target x86_64-apple-darwin --bin cc-switch-remote-helper
            mkdir -p src-tauri/target/universal-apple-darwin/release
            lipo -create \
              -output src-tauri/target/universal-apple-darwin/release/cc-switch-remote-helper \
              src-tauri/target/aarch64-apple-darwin/release/cc-switch-remote-helper \
              src-tauri/target/x86_64-apple-darwin/release/cc-switch-remote-helper
            chmod +x src-tauri/target/universal-apple-darwin/release/cc-switch-remote-helper
          else
            cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features --features proxy-runtime --bin cc-switch-remote-helper
          fi

      - name: Prepare helper artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p helper-artifacts
          short_sha="${SOURCE_SHA::8}"
          sha_asset="cc-switch-remote-helper-${short_sha}-${{ matrix.helper_os }}-${{ matrix.helper_arch }}"
          latest_asset="cc-switch-remote-helper-latest-${{ matrix.helper_os }}-${{ matrix.helper_arch }}"
          cp "${{ matrix.helper_path }}" "helper-artifacts/${sha_asset}"
          cp "${{ matrix.helper_path }}" "helper-artifacts/${latest_asset}"
          chmod +x "helper-artifacts/${sha_asset}" "helper-artifacts/${latest_asset}"
          ls -la helper-artifacts

      - name: Upload helper artifact
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-remote-helper-${{ matrix.helper_os }}-${{ matrix.helper_arch }}
          path: helper-artifacts/*
          if-no-files-found: error

  publish-helper-release:
    name: Publish Helper Release
    runs-on: ubuntu-22.04
    needs: [source, build-helper]
    # Repair runs must not replace the rolling release with a partial platform set.
    # Even a full source_ref rebuild is build-only; automatic publication uses main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all' && inputs.source_ref == ''))
    env:
      SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          fetch-depth: 0

      - name: Download helper artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cc-switch-remote-helper-*
          path: helper-release
          merge-multiple: true

      - name: Publish remote-helper-latest release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: remote-helper-latest
        run: |
          set -euxo pipefail
          ls -la helper-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$SOURCE_SHA"
          git tag -f "$TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CC Switch Remote Helper Latest" \
              --notes "Latest pure CLI remote helper binaries for cc-switch-remote."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CC Switch Remote Helper Latest" \
              --notes "Latest pure CLI remote helper binaries for cc-switch-remote." \
              --prerelease
          fi
          # 首次在该仓库发布时 release 还没有任何资产，grep 找不到匹配会以 1 退出；
          # 在 set -euo pipefail 下这会被当成失败，资产永远上传不上去（2026-10-13 实际发生）。
          while read -r asset; do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
          done < <(
            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              grep -E '^(cc-switch-remote-helper|cc-switch-cli)-' || true
          )
          gh release upload "$TAG" helper-release/* --clobber --repo "$GITHUB_REPOSITORY"
